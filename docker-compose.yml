services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: disha_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-disha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disha}
      POSTGRES_DB: ${POSTGRES_DB:-disha_ai}
    ports:
      - "5432:5432"
    volumes:
      - disha_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-disha} -d ${POSTGRES_DB:-disha_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  disha_ai_pgdata:
